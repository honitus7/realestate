{# Usage: {% include 'components/button.html' with label='Save', type='primary', id='save-btn' %}
   type: primary | secondary | danger. size: sm | (default) | lg #}
<button type="{{ button_type|default('button') }}"
        class="btn btn-{{ btn_style|default('primary') }} {% if btn_size %}btn-{{ btn_size }}{% endif %}"
        {% if button_id %}id="{{ button_id }}"{% endif %}
        {% if disabled %}disabled{% endif %}>
    {{ label }}
</button>
