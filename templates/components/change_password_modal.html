<div class="modal-backdrop" id="change-password-modal">
    <div class="modal" role="dialog" aria-modal="true" aria-label="Change password">
        <div class="modal-head">
            <h2 class="modal-title">Change Password</h2>
            <button type="button" class="modal-close" id="change-password-close" aria-label="Close">&times;</button>
        </div>
        <div class="modal-body">
            <div class="form-group" style="margin-bottom: 1rem;">
                <label class="form-label" for="new-password-input">New password</label>
                <input type="password" id="new-password-input" class="form-input" minlength="6" placeholder="At least 6 characters" autocomplete="new-password">
            </div>
            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label class="form-label" for="confirm-password-input">Confirm new password</label>
                <input type="password" id="confirm-password-input" class="form-input" minlength="6" placeholder="Re-enter new password" autocomplete="new-password">
            </div>
            <div id="change-password-error" class="msg error" style="display:none; margin-bottom: 1rem;"></div>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="cancel-change-password" type="button">Cancel</button>
                <button class="btn btn-primary" id="confirm-change-password" type="button">Update password</button>
            </div>
        </div>
    </div>
</div>
