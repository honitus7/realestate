<!-- Common sidebar component - included across dashboard, CRM, floor plans, day/night pages -->
<!-- Requires: dashboard.css for sidebar styles -->
<!-- Pass active_page variable before including: e.g. {% set active_page = 'dashboard' %} -->

<aside class="dashboard-sidebar" id="dashboard-sidebar" aria-label="Navigation">
    <button type="button" class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">
        <span class="sidebar-toggle-icon"></span>
    </button>
    <div class="sidebar-upload-wrap" id="sidebar-upload-wrap" style="display:none;">
        <button type="button" class="sidebar-upload-btn" id="sidebar-upload-btn" aria-label="Upload panorama">
            <span class="sidebar-upload-icon">+</span>
        </button>
        <span class="sidebar-upload-label">Upload</span>
    </div>
    <nav class="sidebar-nav">
        <a href="/dashboard" class="sidebar-link{% if active_page == 'dashboard' %} active{% endif %}" data-page="dashboard" aria-label="Dashboard">
            <span class="sidebar-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>
            <span class="sidebar-text">Dashboard</span>
        </a>
        <a href="/users" class="sidebar-link{% if active_page == 'users' %} active{% endif %}" id="nav-users" data-page="users" style="display:none;" aria-label="Add user">
            <span class="sidebar-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
            <span class="sidebar-text">Add user</span>
        </a>
        <a href="/explore" class="sidebar-link{% if active_page == 'explore' %} active{% endif %}" id="nav-explore" data-page="explore" aria-label="Customer Portal" target="_blank" style="display:none;">
            <span class="sidebar-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
            <span class="sidebar-text">Customer Portal</span>
        </a>
        <a href="/crm" class="sidebar-link{% if active_page == 'crm' %} active{% endif %}" id="nav-crm" data-page="crm" style="display:none;" aria-label="Customer Relation">
            <span class="sidebar-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
            <span class="sidebar-text">Customer Relation</span>
        </a>
        <a href="/daynight" class="sidebar-link{% if active_page == 'daynight' %} active{% endif %}" id="nav-daynight" data-page="daynight" style="display:none;" aria-label="Day Night Mode">
            <span class="sidebar-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></span>
            <span class="sidebar-text">Day Night Mode</span>
        </a>
        <a href="/floorplans" class="sidebar-link{% if active_page == 'floorplans' %} active{% endif %}" id="nav-floorplans" data-page="floorplans" style="display:none;" aria-label="Floor Plans">
            <span class="sidebar-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></span>
            <span class="sidebar-text">Floor Plans</span>
        </a>
        <a href="/organizations" class="sidebar-link{% if active_page == 'organizations' %} active{% endif %}" id="nav-orgs" data-page="organizations" style="display:none;" aria-label="Organizations">
            <span class="sidebar-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9l-9-7-9 7z"/></svg></span>
            <span class="sidebar-text">Organizations</span>
        </a>
        <a href="#" class="sidebar-link" id="nav-change-password" data-page="change-password" aria-label="Change password">
            <span class="sidebar-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
            <span class="sidebar-text">Change password</span>
        </a>
        <a href="/login" class="sidebar-link" id="nav-logout" data-page="logout" aria-label="Sign out">
            <span class="sidebar-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span>
            <span class="sidebar-text">Sign out</span>
        </a>
    </nav>
    <div class="sidebar-footer">
        <button type="button" class="sidebar-icon-btn" aria-label="Notifications"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></button>
        <div class="sidebar-avatar" id="sidebar-avatar" aria-label="Account">--</div>
    </div>
</aside>
