<!-- Common sidebar component - included across dashboard, CRM, floor plans, day/night pages -->
<!-- Requires: dashboard.css for sidebar styles -->
<!-- Pass active_page variable before including: e.g. {% set active_page = 'dashboard' %} -->

<aside class="dashboard-sidebar" id="dashboard-sidebar" aria-label="Navigation">
    <button type="button" class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">
        <span class="sidebar-toggle-icon" aria-hidden="true">&lsaquo;</span>
    </button>
    <div class="sidebar-upload-wrap" id="sidebar-upload-wrap" style="display:none;">
        <a href="#" class="sidebar-link" id="sidebar-upload-link" data-tooltip="Upload">
            <span class="sidebar-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span>
            <span class="sidebar-text">Upload</span>
        </a>
    </div>
    <nav class="sidebar-nav">
        <a href="/dashboard" class="sidebar-link{% if active_page == 'dashboard' %} active{% endif %}" data-page="dashboard" data-tooltip="Dashboard">
            <span class="sidebar-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>
            <span class="sidebar-text">Dashboard</span>
        </a>
        <a href="/explore" class="sidebar-link{% if active_page == 'explore' %} active{% endif %}" id="nav-explore" data-page="explore" target="_blank" style="display:none;" data-tooltip="Customer Portal">
            <span class="sidebar-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
            <span class="sidebar-text">Customer Portal</span>
        </a>
        <a href="/crm" class="sidebar-link{% if active_page == 'crm' %} active{% endif %}" id="nav-crm" data-page="crm" style="display:none;" data-tooltip="CRM - Customer Relationship Management">
            <span class="sidebar-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
            <span class="sidebar-text">CRM</span>
        </a>
        <a href="/daynight" class="sidebar-link{% if active_page == 'daynight' %} active{% endif %}" id="nav-daynight" data-page="daynight" style="display:none;" data-tooltip="Day Night Mode">
            <span class="sidebar-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></span>
            <span class="sidebar-text">Day Night Mode</span>
        </a>
        <a href="/floorplans" class="sidebar-link{% if active_page == 'floorplans' %} active{% endif %}" id="nav-floorplans" data-page="floorplans" style="display:none;" data-tooltip="Floor Plans">
            <span class="sidebar-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></span>
            <span class="sidebar-text">Floor Plans</span>
        </a>
        <a href="/floorplans?tab=earth-views" class="sidebar-link{% if active_page == 'earthviews' %} active{% endif %}" id="nav-earthviews" data-page="earthviews" style="display:none;" data-tooltip="Earth View">
            <span class="sidebar-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></span>
            <span class="sidebar-text">Earth View</span>
        </a>
        <a href="/full-view" class="sidebar-link{% if active_page == 'fullview' %} active{% endif %}" id="nav-fullview" data-page="fullview" style="display:none;" data-tooltip="Full View Creator">
            <span class="sidebar-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h20v5H2z"/><path d="M2 10h20v5H2z"/><path d="M2 17h20v5H2z"/><circle cx="18" cy="5.5" r="1.5" fill="currentColor" stroke="none"/><circle cx="18" cy="12.5" r="1.5" fill="currentColor" stroke="none"/><circle cx="18" cy="19.5" r="1.5" fill="currentColor" stroke="none"/></svg></span>
            <span class="sidebar-text">Full View</span>
        </a>
        <a href="/organizations" class="sidebar-link{% if active_page == 'organizations' %} active{% endif %}" id="nav-orgs" data-page="organizations" style="display:none;" data-tooltip="Organizations">
            <span class="sidebar-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9l-9-7-9 7z"/></svg></span>
            <span class="sidebar-text">Organizations</span>
        </a>
    </nav>
    <div class="sidebar-footer">
        <div class="sidebar-user-menu-wrap" id="sidebar-user-menu-wrap">
            <button type="button" class="sidebar-user-btn" id="sidebar-user-btn" aria-label="Account menu">
                <div class="sidebar-avatar" id="sidebar-avatar">--</div>
                <span class="sidebar-user-name" id="sidebar-user-name"></span>
            </button>
            <div class="sidebar-user-dropdown" id="sidebar-user-dropdown">
                <a href="#" class="sidebar-dropdown-item" id="nav-change-password">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    Change Password
                </a>
                <a href="/users" class="sidebar-dropdown-item" id="dropdown-add-user" style="display:none;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    Add User
                </a>
                <a href="/user-management" class="sidebar-dropdown-item" id="dropdown-user-mgmt" style="display:none;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4.354a4 4 0 1 1 0 7.292"/><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M20 8v6"/><path d="M23 11h-6"/></svg>
                    User Management
                </a>
                <a href="/client-management" class="sidebar-dropdown-item" id="dropdown-client-mgmt" style="display:none;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    My Team
                </a>
                <div class="sidebar-dropdown-divider"></div>
                <a href="/login" class="sidebar-dropdown-item sidebar-dropdown-item--danger" id="nav-logout">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    Sign Out
                </a>
            </div>
        </div>
    </div>
</aside>
