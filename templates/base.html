<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PropMark{% endblock %}</title>
    <link rel="icon" href="/static/logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/css/components/buttons.css">
    <link rel="stylesheet" href="/static/css/components/cards.css">
    <link rel="stylesheet" href="/static/css/components/tables.css">
    <link rel="stylesheet" href="/static/css/components/modals.css">
    <link rel="stylesheet" href="/static/css/components/forms.css">
    <link rel="stylesheet" href="/static/css/components/layout.css">
    {% block head_css %}{% endblock %}
</head>
<body>
    {% block header %}{% endblock %}
    {% block nav %}{% endblock %}
    <main id="main-content">
        {% block content %}{% endblock %}
    </main>
    <script src="/static/js/supabase.min.js"></script>
    {% block body_scripts %}{% endblock %}
    {% block scripts %}{% endblock %}
</body>
</html>
