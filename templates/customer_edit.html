            elementPositions: { header: { x: null, y: null }, customerLegends: { x: null, y: null }, panoramaNav: { x: null, y: null } }
        };

        function deepMerge(target, source) {
            if (!source || typeof source !== 'object') return target;
            Object.keys(source).forEach(function (key) {
                if (source[key] && typeof source[key] === 'object' && !Array.isArray(source[key]) && target[key] && typeof target[key] === 'object') {
                    deepMerge(target[key], source[key]);
                } else {
                    target[key] = source[key];
                }
            });
            return target;
        }

        function ensurePlotSizeLegendConfig() {
            if (!config.plotSizeLegend || typeof config.plotSizeLegend !== 'object') config.plotSizeLegend = { visible: true, bands: [] };
            var psl = config.plotSizeLegend;
            if (psl.visible !== false && psl.visible !== true) psl.visible = true;
            if (psl.collapsed !== true && psl.collapsed !== false) psl.collapsed = false;
            if (!Array.isArray(psl.bands) || psl.bands.length === 0) {
                psl.bands = [
                    { color: '#E8D5ED', sqftMin: 1000, sqftMax: 1300, sqmMin: 92.9, sqmMax: 120.77, sqydMin: 111, sqydMax: 144.3 },
                    { color: '#E8B849', sqftMin: 1300, sqftMax: 1600, sqmMin: 120.77, sqmMax: 150, sqydMin: 144.3, sqydMax: 177.6 },
                    { color: '#C5E8C8', sqftMin: 1600, sqftMax: 1800, sqmMin: 148.64, sqmMax: 167.22, sqydMin: 177.77, sqydMax: 200 },
                    { color: '#5BC0EB', sqftMin: 1800, sqftMax: 2200, sqmMin: 165, sqmMax: 205, sqydMin: 199.8, sqydMax: 244.2 },
                    { color: '#FFF4D6', sqftMin: 2200, sqftMax: 2500, sqmMin: 205, sqmMax: 235, sqydMin: 244.2, sqydMax: 277.5 }
                ];
            }
        }

        function formatPlotSizeLegendNum(n) {
            var x = Number(n);
            if (!isFinite(x)) return '—';
            if (Math.abs(x - Math.round(x)) < 1e-6) return String(Math.round(x));
            var t = x.toFixed(2);
            if (t.indexOf('.') >= 0) t = t.replace(/0+$/, '').replace(/\.$/, '');
            return t;
        }

        function wireCvPlotSizeLegendPreview(el) {
            if (!el) return;
            var tgl = el.querySelector('.plot-size-collapse-toggle');
            var hdl = el.querySelector('.plot-size-drag-handle');
            if (tgl) {
                tgl.addEventListener('click', function (ev) {
                    ev.preventDefault();
                    ev.stopPropagation();
                    var now = el.classList.toggle('plot-size-legend--collapsed');
                    tgl.setAttribute('aria-expanded', now ? 'false' : 'true');
                    var ic = tgl.querySelector('.plot-size-caret');
                    if (ic) ic.setAttribute('icon', now ? 'ph:caret-down' : 'ph:caret-up');
                });
            }
            if (hdl) {
                hdl.addEventListener('pointerdown', function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    var stack = document.getElementById('cv-legend-stack');
                    if (!stack) return;
                    var rect = stack.getBoundingClientRect();
                    var grabX = e.clientX - rect.left;
                    var grabY = e.clientY - rect.top;
                    function move(ev) {
                        stack.style.position = 'fixed';
                        stack.style.left = (ev.clientX - grabX) + 'px';
                        stack.style.top = (ev.clientY - grabY) + 'px';
                        stack.style.right = 'auto';
                        stack.style.bottom = 'auto';
                        stack.style.transform = 'none';
                    }
                    function up() {
                        document.removeEventListener('pointermove', move);
                        document.removeEventListener('pointerup', up);
                        var r = stack.getBoundingClientRect();
                        if (!config.elementPositions) config.elementPositions = {};
                        if (!config.elementPositions.customerLegends) config.elementPositions.customerLegends = { x: null, y: null };
                        config.elementPositions.customerLegends.x = r.left;
                        config.elementPositions.customerLegends.y = r.top;
                        applyConfig();
                    }
                    document.addEventListener('pointermove', move);
                    document.addEventListener('pointerup', up);
                });
            }
        }

        function renderCvPlotSizeLegend() {
            var el = document.getElementById('cv-plot-size-legend');
            if (!el) return;
            ensurePlotSizeLegendConfig();
            var psl = config.plotSizeLegend;
            var tc = (config.statusLegend && config.statusLegend.color) || '#23395f';
            var bands = Array.isArray(psl.bands) ? psl.bands : [];
            var collapsed = psl.collapsed === true;
            var rows = bands.map(function (b) {
                var c = b && b.color && String(b.color).indexOf('#') === 0 ? b.color : '#cccccc';

                renderPanoramaNavList();
                return;

            var imageUrl = '/uploads/{{ panorama.filename }}';
            viewer = new PhotoSphereViewer.Viewer({
                container: psvContainer,
                panorama: imageUrl,
                navbar: false,
                mousewheel: true,
                mousemove: true,
                touchmoveTwoFingers: false,
                loadingTxt: '',
                plugins: [[PhotoSphereViewer.MarkersPlugin, {}]]

            if (typeof THREE === 'undefined' || typeof PhotoSphereViewer === 'undefined' || !PhotoSphereViewer.MarkersPlugin) {
                psvRetryCount += 1;
                if (psvRetryCount < 50) setTimeout(startPsvInit, 100);
                return;
            }
            initPsv();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', fetchCustomerConfigThenInit);
        } else {
            fetchCustomerConfigThenInit();
        }
    </script>
