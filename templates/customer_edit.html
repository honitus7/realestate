<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Customer View – {{ workspace_name }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/vendor/photo-sphere-viewer/photo-sphere-viewer.css">
    <link rel="stylesheet" href="/static/vendor/photo-sphere-viewer/plugins/markers.css">
    <script src="/static/vendor/uevent/browser.js"></script>
    <script src="/static/vendor/three/three.min.js"></script>
    <script src="/static/vendor/photo-sphere-viewer/photo-sphere-viewer.js"></script>
    <script src="/static/vendor/photo-sphere-viewer/plugins/markers.js"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>
    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/css/components/buttons.css">
    <link rel="stylesheet" href="/static/css/components/cards.css">
    <link rel="stylesheet" href="/static/css/components/modals.css">
    <link rel="stylesheet" href="/static/css/components/forms.css">
    <link rel="stylesheet" href="/static/css/components/layout.css">
    <link rel="stylesheet" href="/static/css/customer_3d.css">
    <link rel="stylesheet" href="/static/css/customer_edit.css">
    <script src="/static/js/supabase.min.js"></script>
</head>

<body>
    <script>
        (function () { var url = {{ (supabase_url or '')| tojson }}; var key = {{ (supabase_anon_key or '')| tojson }};
        if (!url || !key || !window.supabase) return;
        var s = window.supabase.createClient(url, key);
        window._supabase = s;
        window.getAuthHeaders = function () { return s.auth.getSession().then(function (r) { var h = {}; if (r.data.session && r.data.session.access_token) h['Authorization'] = 'Bearer ' + r.data.session.access_token; return h; }); };
    }) ();
    </script>

    <div class="ce-element-modal-backdrop" id="ce-element-modal-backdrop">
        <div class="ce-element-modal" id="ce-element-modal">
            <div class="ce-element-modal-header">
                <span class="ce-element-modal-title" id="ce-element-modal-title">Element</span>
                <div class="ce-element-modal-header-actions">
                    <button type="button" class="ce-element-collapse-btn" id="ce-element-collapse-btn" title="Collapse">−</button>
                    <button type="button" class="ce-element-close-btn" id="ce-element-close-btn" title="Close">×</button>
                </div>
            </div>
            <div class="ce-element-modal-body" id="ce-element-modal-body"></div>
            <div class="ce-element-modal-footer" id="ce-element-modal-footer">
                <button type="button" class="ce-element-modal-save modal-btn primary" id="ce-element-modal-save-btn">Save</button>
            </div>
        </div>
    </div>

    <button class="ce-element-fab" id="ce-element-fab" type="button" title="Open options" style="display:none;">✎</button>
    <div class="ce-bottom-actions">
        <a href="/dashboard" class="ce-bottom-action-btn" id="ce-dashboard-btn" title="Back to Dashboard" aria-label="Back to Dashboard">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </a>
        <button type="button" class="ce-bottom-action-btn" id="ce-bring-back-all-btn" title="Bring back all" aria-label="Bring back all">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
        <button type="button" class="ce-bottom-action-btn ce-bottom-action-save" id="ce-save-btn" title="Save" aria-label="Save">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        </button>
    </div>

    <div class="ce-canvas-wrap" id="ce-canvas-wrap">
        <div id="psv-container" style="position:absolute;top:0;left:0;width:100%;height:100%;background:var(--color-bg);cursor:grab;"></div>

        <div class="overlay-gradient" id="cv-overlay-gradient"></div>

        <div class="ui-overlay" id="cv-ui-overlay">
            <header class="header ce-editable" id="cv-header" data-ce-id="header">
                <div class="header-left">
                    <button id="panorama-nav-toggle" class="hdr-action-btn panorama-nav-toggle-btn ce-editable" type="button" data-ce-id="panoramaNavToggle" aria-expanded="false" title="Panorama List">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="100" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
                        </svg>
                    </button>
                    <div class="project-badge ce-editable" id="cv-project-badge" data-ce-id="projectBadge">
                        <span class="project-badge-name" id="cv-badge-name">{{ panorama.name }}</span>
                        <span class="project-badge-dot"></span>
                        <span class="project-badge-label" id="cv-badge-label">360° Explorer</span>
                    </div>
                </div>
                <div class="header-center" id="cv-header-center">
                    <div class="search-shell ce-editable" id="plot-search-shell" data-ce-id="searchBar">
                        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        <input id="plot-search-input" class="search-plot-input" type="search" placeholder="Search plots..." disabled>
                    </div>
                </div>
                <div class="header-right">
                    <button id="cv-back-btn" class="hdr-action-btn ce-editable" type="button" data-ce-id="backBtn" title="Go back">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                    </button>
                    <button id="cv-export-btn" class="hdr-action-btn ce-editable" type="button" data-ce-id="exportPlots" title="Export plots">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    </button>
                    <button id="cv-overlays-btn" class="hdr-action-btn ce-editable" type="button" data-ce-id="toggleOverlays" title="Toggle overlays">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                    <button id="cv-fullscreen-btn" class="hdr-action-btn ce-editable" type="button" data-ce-id="fullscreen" title="Fullscreen">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
                    </button>
                    <div class="hdr-divider"></div>
                    <button id="cv-cart-btn" class="hdr-cart-btn ce-editable" type="button" data-ce-id="viewCart" title="View cart">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                        <span class="cart-badge">0</span>
                    </button>
                </div>
            </header>
        </div>

        <div class="panorama-nav-shell ce-editable is-collapsed" id="cv-panorama-nav-shell" data-ce-id="panoramaNav">
            <aside class="panorama-nav-panel" id="cv-panorama-nav-panel">
                <div class="panorama-nav-head">
                    <div class="panorama-nav-head-text">
                        <div class="panorama-nav-title">Panorama List</div>
                        <div class="panorama-nav-subtitle" id="cv-panorama-nav-subtitle"></div>
                    </div>
                    <button type="button" class="panorama-nav-collapse-btn" id="cv-panorama-nav-collapse" title="Close" aria-label="Close panorama list">×</button>
                </div>
                <div class="panorama-nav-list" id="cv-panorama-nav-list"></div>
            </aside>
        </div>

        <div class="status-legend ce-editable" id="cv-status-legend" data-ce-id="statusLegend">
            <div class="legend-head">
                <span>Plot Range</span>
                <span class="legend-total">0</span>
            </div>
            <div class="legend-grid">
                <div class="status-pill available"><span class="status-dot"></span><span>Available</span><strong>0</strong></div>
                <div class="status-pill hold"><span class="status-dot"></span><span>On Hold</span><strong>0</strong></div>
                <div class="status-pill sold"><span class="status-dot"></span><span>Sold</span><strong>0</strong></div>
            </div>
        </div>
    </div>

    <div class="ce-toast" id="ce-toast"></div>

    <script>
        var WORKSPACE_ID = {{ workspace_id | tojson }};
        var WORKSPACE_PANORAMAS = {{ (workspace_panoramas or []) | tojson }};
        var PANORAMA_ID = {{ panorama.id }};
        var CE_FONTS = ['Syne', 'Inter', 'Poppins', 'DM Sans', 'Space Grotesk', 'Instrument Serif'];
        var MOVE_STEP = 10;

        var config = {
            theme: { primaryColor: '#b5772d', headerBg: '#f6f8fc', headerTextColor: '#23395f', buttonBg: '#f6f8fc', buttonTextColor: '#23395f' },
            transparency: { header: 0.93, overlayGradient: 0.22, statusLegend: 0.85, panoramaNav: 0.72 },
            header: { position: 'top', font: 'Syne', fontSize: '1rem' },
            projectBadge: { visible: true, customText: '', customLabel: '', font: 'Syne', fontSize: '0.85rem' },
            buttons: { panoramaNavToggle: true, backBtn: true, exportPlots: true, toggleOverlays: true, fullscreen: true, viewCart: true },
            searchBar: { visible: true },
            statusLegend: { visible: true, color: '#23395f', bg: '#f7f9fd' },
            panoramaList: { visible: true, order: [], position: 'left', verticalAlign: 'top', title: 'Panorama List', subheader: null, titleFont: 'Syne', subheaderFont: 'Syne', itemFont: 'Syne', titleFontSize: '0.6rem', subheaderFontSize: '0.52rem', itemFontSize: '0.76rem', panelBg: '#0a1220', titleColor: '#7a8ba8', subheaderColor: '#a0aec0', itemColor: '#1a2e4d' },
            elementPositions: { header: { x: 0, y: 0 }, statusLegend: { x: null, y: null }, panoramaNav: { x: null, y: null } }
        };

        function deepMerge(target, source) {
            if (!source || typeof source !== 'object') return target;
            Object.keys(source).forEach(function (key) {
                if (source[key] && typeof source[key] === 'object' && !Array.isArray(source[key]) && target[key] && typeof target[key] === 'object') {
                    deepMerge(target[key], source[key]);
                } else {
                    target[key] = source[key];
                }
            });
            return target;
        }

        function fetchCustomerConfigThenInit() {
            if (!window.getAuthHeaders) { startPsvInit(); return; }
            return window.getAuthHeaders().then(function (headers) {
                return fetch('/api/workspaces/' + WORKSPACE_ID + '/customer-config', { headers: headers });
            }).then(function (res) {
                if (res.status === 401 || res.status === 403) { window.location.href = '/dashboard'; return Promise.reject(new Error('Unauthorized')); }
                return res.json();
            }).then(function (data) {
                if (data && data.config && typeof data.config === 'object') deepMerge(config, data.config);
                if (config.panoramaList && !Array.isArray(config.panoramaList.order)) config.panoramaList.order = [];
                startPsvInit();
            }).catch(function (err) {
                if (err && err.message !== 'Unauthorized') startPsvInit();
            });
        }

        var elementModalBackdrop = document.getElementById('ce-element-modal-backdrop');
        var elementModal = document.getElementById('ce-element-modal');
        var elementModalTitle = document.getElementById('ce-element-modal-title');
        var elementModalBody = document.getElementById('ce-element-modal-body');
        var elementModalFooter = document.getElementById('ce-element-modal-footer');
        var elementModalSaveBtn = document.getElementById('ce-element-modal-save-btn');
        var elementCollapseBtn = document.getElementById('ce-element-collapse-btn');
        var elementCloseBtn = document.getElementById('ce-element-close-btn');
        var elementFab = document.getElementById('ce-element-fab');
        var saveBtn = document.getElementById('ce-save-btn');
        var toastEl = document.getElementById('ce-toast');

        function saveCustomerConfig() {
            if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = 'Saving...'; }
            if (elementModalSaveBtn) { elementModalSaveBtn.disabled = true; elementModalSaveBtn.textContent = 'Saving...'; }
            return window.getAuthHeaders().then(function (headers) {
                headers['Content-Type'] = 'application/json';
                return fetch('/api/workspaces/' + WORKSPACE_ID + '/customer-config', { method: 'PATCH', headers: headers, body: JSON.stringify({ config: config }) });
            }).then(function (r) { return r.json(); }).then(function (data) {
                if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = 'Save'; }
                if (elementModalSaveBtn) { elementModalSaveBtn.disabled = false; elementModalSaveBtn.textContent = 'Save'; }
                if (data.success) { showToast('Saved'); if (elementModalBackdrop && elementModalBackdrop.classList.contains('visible')) closeElementModal(); }
                else showToast('Error: ' + (data.error || 'Save failed'));
            }).catch(function (err) {
                if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = 'Save'; }
                if (elementModalSaveBtn) { elementModalSaveBtn.disabled = false; elementModalSaveBtn.textContent = 'Save'; }
                showToast('Error: ' + err.message);
            });
        }

        var currentElementId = null;
        var elementLabels = {
            header: 'Header',
            projectBadge: 'Project badge',
            panoramaNavToggle: 'Panorama list button',
            searchBar: 'Search bar',
            backBtn: 'Back button',
            exportPlots: 'Export plots',
            toggleOverlays: 'Toggle overlays',
            fullscreen: 'Fullscreen',
            viewCart: 'View cart',
            statusLegend: 'Plot Range',
            panoramaNav: 'Panorama list'
        };
        var textElements = { header: true, projectBadge: true };

        function escapeHtml(str) {
            var d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }

        function showToast(msg) {
            if (!toastEl) return;
            toastEl.textContent = msg;
            toastEl.classList.add('visible');
            setTimeout(function () { toastEl.classList.remove('visible'); }, 2500);
        }

        function hexToRgba(hex, alpha) {
            if (!hex || hex.length < 7) return 'rgba(0,0,0,' + alpha + ')';
            var r = parseInt(hex.slice(1, 3), 16);
            var g = parseInt(hex.slice(3, 5), 16);
            var b = parseInt(hex.slice(5, 7), 16);
            return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
        }

        function applyConfig() {
            var header = document.getElementById('cv-header');
            var uiOverlay = document.getElementById('cv-ui-overlay');
            var gradient = document.getElementById('cv-overlay-gradient');
            var legend = document.getElementById('cv-status-legend');
            var navShell = document.getElementById('cv-panorama-nav-shell');
            var badge = document.getElementById('cv-project-badge');
            var badgeName = document.getElementById('cv-badge-name');
            var badgeLabel = document.getElementById('cv-badge-label');
            var searchShell = document.getElementById('plot-search-shell');
            var navToggle = document.getElementById('panorama-nav-toggle');
            var backBtn = document.getElementById('cv-back-btn');
            var exportBtn = document.getElementById('cv-export-btn');
            var overlaysBtn = document.getElementById('cv-overlays-btn');
            var fullscreenBtn = document.getElementById('cv-fullscreen-btn');
            var cartBtn = document.getElementById('cv-cart-btn');

            var t = config.theme;
            var headerLeft = header && header.querySelector('.header-left');
            var headerRight = header && header.querySelector('.header-right');
            var searchInput = document.getElementById('plot-search-input');
            if (header) {
                header.style.background = 'transparent';
                header.style.color = t.headerTextColor;
                header.style.fontFamily = config.header.font + ', sans-serif';
                header.style.fontSize = config.header.fontSize;
            }
            if (headerLeft) {
                var hideHeaderLeft = !config.projectBadge.visible && !config.buttons.panoramaNavToggle;
                headerLeft.style.display = hideHeaderLeft ? 'none' : '';
                headerLeft.style.background = hexToRgba(t.headerBg, config.transparency.header);
                headerLeft.style.color = t.headerTextColor;
                headerLeft.style.backdropFilter = 'blur(18px) saturate(160%)';
                headerLeft.style.webkitBackdropFilter = 'blur(18px) saturate(160%)';
            }
            if (headerRight) {
                var allRightHidden = !config.buttons.backBtn && !config.buttons.exportPlots && !config.buttons.toggleOverlays && !config.buttons.fullscreen && !config.buttons.viewCart;
                headerRight.style.display = allRightHidden ? 'none' : '';
                headerRight.style.background = hexToRgba(t.headerBg, config.transparency.header);
                headerRight.style.color = t.buttonTextColor;
                headerRight.style.backdropFilter = 'blur(18px) saturate(160%)';
                headerRight.style.webkitBackdropFilter = 'blur(18px) saturate(160%)';
            }
            if (searchShell) {
                searchShell.style.background = 'transparent';
            }
            if (searchInput) {
                searchInput.style.background = hexToRgba(t.headerBg, config.transparency.header);
                searchInput.style.color = t.headerTextColor;
                searchInput.style.borderColor = 'rgba(22, 35, 56, 0.08)';
            }
            [navToggle, backBtn, exportBtn, overlaysBtn, fullscreenBtn, cartBtn].forEach(function (btn) {
                if (btn) { btn.style.background = 'transparent'; btn.style.color = t.buttonTextColor; }
            });
            if (badgeName) badgeName.style.color = t.primaryColor;
            if (gradient) gradient.style.opacity = config.transparency.overlayGradient;
            if (legend) {
                legend.style.background = hexToRgba(config.statusLegend.bg || '#f7f9fd', config.transparency.statusLegend);
                legend.style.color = config.statusLegend.color || '#23395f';
            }
            if (navShell && navShell.querySelector('.panorama-nav-panel')) {
                navShell.querySelector('.panorama-nav-panel').style.background = hexToRgba('#0a1220', config.transparency.panoramaNav);
            }
            if (uiOverlay) {
                if (config.header.position === 'bottom') { uiOverlay.style.top = 'auto'; uiOverlay.style.bottom = '0'; }
                else { uiOverlay.style.top = '0'; uiOverlay.style.bottom = ''; }
            }
            if (badge) badge.style.display = config.projectBadge.visible ? '' : 'none';
            if (badgeName) badgeName.textContent = config.projectBadge.customText || {{ (panorama.name or '') | tojson }};
            if (badgeLabel) badgeLabel.textContent = config.projectBadge.customLabel || '360° Explorer';
            if (badge) badge.style.fontFamily = config.projectBadge.font + ', sans-serif';
            if (badgeName) badgeName.style.fontSize = config.projectBadge.fontSize;
            if (navToggle) navToggle.style.display = config.buttons.panoramaNavToggle ? '' : 'none';
            if (backBtn) backBtn.style.display = config.buttons.backBtn ? '' : 'none';
            if (exportBtn) exportBtn.style.display = config.buttons.exportPlots ? '' : 'none';
            if (overlaysBtn) overlaysBtn.style.display = config.buttons.toggleOverlays ? '' : 'none';
            if (fullscreenBtn) fullscreenBtn.style.display = config.buttons.fullscreen ? '' : 'none';
            if (cartBtn) cartBtn.style.display = config.buttons.viewCart ? '' : 'none';
            if (searchShell) searchShell.style.display = config.searchBar.visible ? '' : 'none';
            if (legend) legend.style.display = config.statusLegend.visible ? '' : 'none';
            if (navShell) {
                navShell.style.display = config.panoramaList.visible ? '' : 'none';
                if (config.panoramaList.visible) {
                    navShell.classList.remove('is-collapsed');
                    var pnavTgl = document.getElementById('panorama-nav-toggle');
                    if (pnavTgl) pnavTgl.setAttribute('aria-expanded', 'true');
                }
                var panel = navShell.querySelector('.panorama-nav-panel');
                var head = navShell.querySelector('.panorama-nav-head');
                var titleEl = navShell.querySelector('.panorama-nav-title');
                var subtitleEl = navShell.querySelector('.panorama-nav-subtitle');
                var listEl = navShell.querySelector('.panorama-nav-list');
                if (panel) {
                    var pBg = config.panoramaList.panelBg || '#0a1220';
                    panel.style.background = hexToRgba(pBg, config.transparency.panoramaNav);
                    panel.style.display = 'flex';
                    panel.style.flexDirection = 'column';
                    panel.style.height = '100vh';
                    var va = config.panoramaList.verticalAlign || 'top';
                    panel.style.justifyContent = va === 'center' ? 'center' : va === 'bottom' ? 'flex-end' : 'flex-start';
                }
                if (titleEl) {
                    titleEl.textContent = config.panoramaList.title || 'Panorama List';
                    titleEl.style.fontFamily = (config.panoramaList.titleFont || 'Syne') + ', sans-serif';
                    titleEl.style.fontSize = config.panoramaList.titleFontSize || '0.6rem';
                    titleEl.style.color = config.panoramaList.titleColor || '#7a8ba8';
                }
                if (subtitleEl) {
                    subtitleEl.textContent = config.panoramaList.subheader != null && config.panoramaList.subheader !== '' ? config.panoramaList.subheader : (WORKSPACE_PANORAMAS.length + ' panorama' + (WORKSPACE_PANORAMAS.length !== 1 ? 's' : ''));
                    subtitleEl.style.fontFamily = (config.panoramaList.subheaderFont || 'Syne') + ', sans-serif';
                    subtitleEl.style.fontSize = config.panoramaList.subheaderFontSize || '0.52rem';
                    subtitleEl.style.color = config.panoramaList.subheaderColor || '#a0aec0';
                }
                if (listEl) {
                    listEl.style.fontFamily = (config.panoramaList.itemFont || 'Syne') + ', sans-serif';
                    listEl.style.fontSize = config.panoramaList.itemFontSize || '0.76rem';
                    listEl.style.color = config.panoramaList.itemColor || '#1a2e4d';
                }
            }
            var ep = config.elementPositions || {};

                elementFab.style.display = 'block';
            } else {
                elementModalBackdrop.classList.remove('ce-element-collapsed');
                elementModalBody.style.display = '';
                if (elementModalFooter) elementModalFooter.style.display = '';
                elementCollapseBtn.textContent = '−';
                elementFab.style.display = 'none';
            }
            if (viewer) viewer.autoSize();
        }

        var canvasWrap = document.getElementById('ce-canvas-wrap');
        if (canvasWrap) {
            canvasWrap.addEventListener('click', function (e) {
                if (e.target.closest('#ce-element-modal-backdrop')) return;
                var editable = e.target.closest('.ce-editable');
                if (editable && editable.dataset.ceId) {
                    e.stopPropagation();
                    e.preventDefault();
                    openElementModal(editable.dataset.ceId);
                }
            }, true);
        }

        if (elementCloseBtn) elementCloseBtn.addEventListener('click', closeElementModal);
        if (elementCollapseBtn) elementCollapseBtn.addEventListener('click', function () {
            setElementModalCollapsed(elementModalBackdrop.classList.contains('ce-element-collapsed') ? false : true);
        });
        if (elementFab) elementFab.addEventListener('click', function () { setElementModalCollapsed(false); });
        if (elementModalBackdrop) elementModalBackdrop.addEventListener('click', function (e) {
            if (e.target === elementModalBackdrop) closeElementModal();
        });

        if (saveBtn) saveBtn.addEventListener('click', saveCustomerConfig);
        if (elementModalSaveBtn) elementModalSaveBtn.addEventListener('click', saveCustomerConfig);

        var bringBackAllBtn = document.getElementById('ce-bring-back-all-btn');
        if (bringBackAllBtn) bringBackAllBtn.addEventListener('click', function () {
            config.projectBadge.visible = true;
            config.buttons.panoramaNavToggle = true;
            config.buttons.backBtn = true;
            config.buttons.exportPlots = true;
            config.buttons.toggleOverlays = true;
            config.buttons.fullscreen = true;
            config.buttons.viewCart = true;
            config.searchBar.visible = true;
            config.statusLegend.visible = true;
            config.panoramaList.visible = true;
            applyConfig();
            showToast('All elements shown');
        });

        var pnavShell = document.getElementById('cv-panorama-nav-shell');
        var pnavToggle = document.getElementById('panorama-nav-toggle');
        var pnavCollapse = document.getElementById('cv-panorama-nav-collapse');
        if (pnavCollapse && pnavShell) pnavCollapse.addEventListener('click', function () {
            pnavShell.classList.add('is-collapsed');
            if (pnavToggle) pnavToggle.setAttribute('aria-expanded', 'false');
        });
        if (pnavToggle && pnavShell) pnavToggle.addEventListener('click', function (e) {
            if (pnavShell.classList.contains('is-collapsed')) {
                pnavShell.classList.remove('is-collapsed');
                pnavToggle.setAttribute('aria-expanded', 'true');
                e.preventDefault();
                e.stopPropagation();
            }
        }, true);

        var viewer = null;
        var psvContainer = document.getElementById('psv-container');
        var psvRetryCount = 0;

        function renderPanoramaNavList() {
            var listEl = document.getElementById('cv-panorama-nav-list');
            var subtitleEl = document.getElementById('cv-panorama-nav-subtitle');
            var ordered = config.panoramaList.order && config.panoramaList.order.length > 0
                ? config.panoramaList.order.map(function (id) { return WORKSPACE_PANORAMAS.find(function (p) { return String(p.id) === String(id); }); }).filter(Boolean)
                : WORKSPACE_PANORAMAS.slice();
            WORKSPACE_PANORAMAS.forEach(function (p) {
                if (!ordered.find(function (o) { return o && String(o.id) === String(p.id); })) ordered.push(p);
            });
            if (subtitleEl) subtitleEl.textContent = config.panoramaList.subheader != null && config.panoramaList.subheader !== '' ? config.panoramaList.subheader : ordered.length + ' panorama' + (ordered.length !== 1 ? 's' : '');
            if (!listEl) return;
            listEl.innerHTML = '';
            ordered.forEach(function (p) {
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'panorama-nav-item' + (p.id === PANORAMA_ID ? ' active' : '');
                btn.innerHTML = '<span class="panorama-nav-item-name">' + escapeHtml(p.name) + '</span>';
                listEl.appendChild(btn);
            });
        }

        function initPsv() {
            if (!psvContainer) return;
            var imageUrl = '/uploads/{{ panorama.filename }}';
            viewer = new PhotoSphereViewer.Viewer({
                container: psvContainer,
                panorama: imageUrl,
                navbar: false,
                mousewheel: true,
                mousemove: true,
                touchmoveTwoFingers: false,
                loadingTxt: '',
                plugins: [[PhotoSphereViewer.MarkersPlugin, {}]]
            });
            viewer.on('ready', function () {
                applyConfig();
                renderPanoramaNavList();
            });
        }

        function startPsvInit() {
            if (typeof THREE === 'undefined' || typeof PhotoSphereViewer === 'undefined' || !PhotoSphereViewer.MarkersPlugin) {
                psvRetryCount += 1;
                if (psvRetryCount < 50) setTimeout(startPsvInit, 100);
                return;
            }
            initPsv();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', fetchCustomerConfigThenInit);
        } else {
            fetchCustomerConfigThenInit();
        }
    </script>
</body>

</html>
