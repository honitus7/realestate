<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ workspace_name or 'Full View' }} – PropMark</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/css/fv_sidebar.css">
    <script src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #0c0e14; }
        /* Common shell header */
        .cfv-header {
            position: fixed;
            top: 14px;
            left: 14px;
            z-index: 200;
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 8px 14px;
            background: rgba(12, 14, 20, 0.82);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: rgba(255,255,255,0.92);
            max-width: min(68vw, 620px);
        }
        .cfv-header-title {
            font-size: 0.9rem;
            font-weight: 700;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .cfv-header-sub {
            font-size: 0.74rem;
            font-weight: 500;
            color: rgba(255,255,255,0.68);
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Content iframe — fills the whole viewport */
        #cfv-frame {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

    </style>
</head>
<body>
<div class="cfv-header" id="cfv-header">
        <div class="cfv-header-title" id="cfv-header-title">{{ workspace_name or 'Project' }}</div>
        <div class="cfv-header-sub" id="cfv-header-sub">Full View</div>
    </div>

    <!-- Content iframe — renders floor plans / gallery / daynight / project plan -->
    <iframe id="cfv-frame" src="about:blank" allow="autoplay; encrypted-media; picture-in-picture; fullscreen"></iframe>

    <!-- Full View Sidebar -->
    {% if fv_config and fv_config.get('is_active') and fv_config.get('tabs') %}
    <nav class="fv-sidebar" id="fv-sidebar" aria-label="Full View Navigation">
        {% for tab in fv_config.get('tabs', []) %}
        <button class="fv-sidebar-btn" type="button"
                data-tab-type="{{ tab.tab_type }}"
                data-ref-panorama="{{ tab.ref_panorama_id or '' }}"
                data-ref-daynight="{{ tab.ref_daynight_id or '' }}"
                data-ref-floorplan="{{ tab.ref_floor_plan_id or '' }}"
                data-ref-gallery="{{ tab.ref_gallery_id or '' }}"
                data-ref-projectplan="{{ tab.ref_project_plan_id or '' }}"
                data-content='{{ (tab.content_data or {}) | tojson }}'
                title="{{ tab.name }}">
            <span class="fv-sidebar-icon"><iconify-icon icon="{{ tab.icon }}"></iconify-icon></span>
            <span class="fv-sidebar-label">{{ tab.name }}</span>
        </button>
        {% endfor %}
    </nav>
    {% endif %}

    <button type="button" class="fv-nav-reveal-fab" id="fv-nav-reveal-fab" aria-label="Show navigation" hidden></button>

<script>
(function () {
    'use strict';

    var WS_ID   = {{ (workspace_id or '') | tojson }};
    var INIT_TYPE = {{ (init_type or '') | tojson }};
    var INIT_REF  = {{ (init_ref  or '') | tojson }};

    var frame   = document.getElementById('cfv-frame');
    var sidebar = document.getElementById('fv-sidebar');
    var headerTitleEl = document.getElementById('cfv-header-title');
    var headerSubEl = document.getElementById('cfv-header-sub');
    var navFab = document.getElementById('fv-nav-reveal-fab');
    var activeBtn = null;
    var DEBUG = true;

    function fvLog(level, message, data) {
        if (!DEBUG) return;
        var stamp = new Date().toISOString();
        var prefix = '[FV][' + stamp + '] ' + message;
        if (level === 'error') {
            console.error(prefix, data || '');
            return;
        }
        if (level === 'warn') {
            console.warn(prefix, data || '');
            return;
        }
        console.log(prefix, data || '');
    }

    function normalizeTabType(type) {
        return String(type || '').trim().toLowerCase();
    }

    function normalizeContentData(raw) {
        if (!raw) return {};
        if (typeof raw === 'string') return { url: raw.trim() };
        if (typeof raw !== 'object') return {};
        var url = raw.url || raw.video_url || raw.youtube_url || raw.embed_url || raw.link || raw.src || '';
        if (url) return { ...raw, url: String(url).trim() };
        return raw;
    }

    function parseContentData(btn) {
        try {
            var parsed = JSON.parse(btn.dataset.content || '{}');
            return normalizeContentData(parsed);
        } catch (e) {
            fvLog('error', 'Failed to parse tab content JSON', {
                title: btn && btn.title,
                raw: btn ? btn.dataset.content : null,
                error: String(e && e.message || e)
            });
            return {};
        }
    }

    function sanitizeUrl(rawUrl) {
        var url = String(rawUrl || '').trim();
        if (!url) return '';
        if (/^(www\.|youtu\.be\/|youtube\.com\/|m\.youtube\.com\/)/i.test(url)) return 'https://' + url;
        if (/^\/\//.test(url)) return 'https:' + url;
        return url;
    }

    function extractYouTubeIdLoose(rawText) {
        var text = String(rawText || '');
        if (!text) return null;
        var patterns = [
            /[?&]v=([A-Za-z0-9_-]{11})/i,
            /youtu\.be\/([A-Za-z0-9_-]{11})/i,
            /\/embed\/([A-Za-z0-9_-]{11})/i,
            /\/shorts\/([A-Za-z0-9_-]{11})/i,
            /\/live\/([A-Za-z0-9_-]{11})/i
        ];
        for (var i = 0; i < patterns.length; i++) {
            var m = text.match(patterns[i]);
            if (m && m[1]) return m[1];
        }
        return null;
    }

    function extractYouTubeId(rawUrl) {
        var normalized = sanitizeUrl(rawUrl);
        if (!normalized) return null;
        try {
            var url = new URL(normalized);
            var host = (url.hostname || '').toLowerCase();
            var path = url.pathname || '';
            var id = null;

            if (host === 'youtu.be') {
                var parts = path.split('/').filter(Boolean);
                id = parts[0] || null;
            } else if (host.endsWith('youtube.com') || host.endsWith('youtube-nocookie.com')) {
                if (path === '/watch') id = url.searchParams.get('v');
                else if (path.startsWith('/embed/')) id = path.split('/')[2] || null;
                else if (path.startsWith('/shorts/')) id = path.split('/')[2] || null;
                else if (path.startsWith('/live/')) id = path.split('/')[2] || null;
            } else if (host === 'm.youtube.com') {
                if (path === '/watch') id = url.searchParams.get('v');
            }

            if (!id) return null;
            id = id.trim();
            if (!/^[A-Za-z0-9_-]{11}$/.test(id)) {
                var compact = id.match(/[A-Za-z0-9_-]{11}/);
                if (compact && compact[0]) id = compact[0];
            }
            if (/^[A-Za-z0-9_-]{11}$/.test(id)) return id;
        } catch (e) {
            // ignore and try loose parsing fallback below
        }
        return extractYouTubeIdLoose(rawUrl) || extractYouTubeIdLoose(normalized);
    }

    function normalizeYouTubeEmbedUrl(rawUrl) {
        var normalized = sanitizeUrl(rawUrl);
        if (!normalized) return null;
        var id = extractYouTubeId(normalized);
        if (!id) return null;
        var params = [
            'autoplay=1',
            'mute=1',
            'playsinline=1',
            'rel=0',
            'modestbranding=1',
            'controls=1'
        ];
        return 'https://www.youtube-nocookie.com/embed/' + id + '?' + params.join('&');
    }

    function isYouTubeEmbedUrl(url) {
        return /^https:\/\/www\.youtube-nocookie\.com\/embed\//i.test(String(url || ''));
    }

    /* ---- build the embed URL for a given type + ref ---- */
    function embedUrl(type, ref, contentData) {
        contentData = normalizeContentData(contentData);
        var contentUrl = (contentData && contentData.url) ? String(contentData.url).trim() : '';
        var ytEmbed = null;
        if (contentUrl) {
            ytEmbed = normalizeYouTubeEmbedUrl(contentUrl);
            if (ytEmbed) return ytEmbed;
        }
        var wsQ = '?workspace_id=' + encodeURIComponent(WS_ID) + '&embed=1';
        if (type === 'floor_plan'  && ref) return '/customer/full-view/floor-plan/'   + ref + wsQ;
        if (type === 'gallery'     && ref) return '/customer/full-view/gallery/'       + ref + wsQ;
        if (type === 'amenities'   && ref) return '/customer/full-view/gallery/'       + ref + wsQ;
        if (type === 'highlights'  && ref) return '/customer/full-view/gallery/'       + ref + wsQ;
        if (type === 'daynight'    && ref) return '/customer/full-view/daynight/'      + ref + wsQ;
        if (type === 'project_plan'&& ref) return '/customer/full-view/project-plan/' + ref + wsQ;
        if (type === 'video') return ytEmbed;
        if (type === 'location' && contentUrl) return contentUrl;
        if (type === 'brochure' && contentUrl) return contentUrl;
        if (type === 'custom'   && contentUrl) return contentUrl;
        return null;
    }

    function setActive(btn) {
        if (activeBtn) activeBtn.classList.remove('fv-sidebar-btn--active');
        activeBtn = btn;
        if (btn) btn.classList.add('fv-sidebar-btn--active');
    }

    function tabDisplayName(btn) {
        if (!btn) return '';
        var labelEl = btn.querySelector('.fv-sidebar-label');
        var label = (labelEl && labelEl.textContent) ? labelEl.textContent.trim() : '';
        if (!label) label = String(btn.title || '').trim();
        return label;
    }

    function isHomeTabName(name) {
        return String(name || '').trim().toLowerCase() === 'home';
    }

    function updateShellHomeSidebarState(btn) {
        if (!sidebar) {
            document.body.classList.remove('fv-home-active');
            if (navFab) {
                navFab.hidden = true;
                navFab.style.display = 'none';
            }
            return;
        }
        var hide = isHomeTabName(tabDisplayName(btn));
        sidebar.classList.toggle('fv-sidebar--hidden', hide);
        document.body.classList.toggle('fv-home-active', hide);
        if (navFab) {
            var showFab = !!hide;
            navFab.hidden = !showFab;
            navFab.style.display = showFab ? 'flex' : 'none';
        }
    }

    if (navFab) {
        navFab.innerHTML = '<iconify-icon icon="ph:list"></iconify-icon>';
    }
    if (navFab) {
        navFab.addEventListener('click', function () {
            if (sidebar) sidebar.classList.remove('fv-sidebar--hidden');
            document.body.classList.remove('fv-home-active');
            navFab.hidden = true;
            navFab.style.display = 'none';
        });
    }

    function loadTab(btn) {
        var rawType = btn.dataset.tabType;
        var type    = normalizeTabType(rawType);
        var pano    = btn.dataset.refPanorama;
        var dn      = btn.dataset.refDaynight;
        var fp      = btn.dataset.refFloorplan;
        var gal     = btn.dataset.refGallery;
        var pp      = btn.dataset.refProjectplan;
        var cd      = parseContentData(btn);
        fvLog('log', 'loadTab called', {
            label: tabDisplayName(btn),
            type: type,
            rawType: rawType,
            refs: { pano: pano, dn: dn, fp: fp, gal: gal, pp: pp },
            contentData: cd
        });
        if (headerTitleEl && !headerTitleEl.textContent) {
            headerTitleEl.textContent = 'Project';
        }
        if (headerSubEl) {
            var labelEl = btn.querySelector('.fv-sidebar-label');
            var label = (labelEl && labelEl.textContent) ? labelEl.textContent.trim() : (btn.title || 'Full View');
            headerSubEl.textContent = label || 'Full View';
        }

        /* ---- 360° / drone: go back to panorama ---- */
        if (type === '360_pano' || type === 'drone_view') {
            var dest = WS_ID ? '/customer/project/' + WS_ID : null;
            fvLog('log', 'Navigating back to panorama route', { dest: dest, pano: pano });
            if (dest) window.location.href = pano ? dest + '?pano=' + pano : dest;
            return;
        }

        /* ---- resolve ref based on type ---- */
        var ref = fp || gal || dn || pp || '';

        /* ---- highlights: prefer gallery, fallback panorama ---- */
        if (type === 'highlights' && !gal && pano) {
            fvLog('log', 'Highlights fallback to panorama route', { workspace_id: WS_ID, pano: pano });
            if (WS_ID) window.location.href = '/customer/project/' + WS_ID + '?pano=' + pano;
            return;
        }

        var url = embedUrl(type, ref, cd);
        fvLog('log', 'Resolved URL for tab', { type: type, ref: ref, url: url });
        if (!url) {
            fvLog('warn', 'No URL resolved for clicked tab', { type: type, ref: ref, contentData: cd });
            setActive(null);
            updateShellHomeSidebarState(null);
            return;
        }

        /* ---- external URL (location/brochure/custom): open new tab ---- */
        if (!isYouTubeEmbedUrl(url) && type !== 'video' && (url.startsWith('http') || url.startsWith('//'))) {
            fvLog('log', 'Opening external URL in new tab', { type: type, url: url });
            window.open(url, '_blank', 'noopener');
            setActive(null);
            updateShellHomeSidebarState(null);
            return;
        }

        setActive(btn);
        fvLog('log', 'Loading tab inside iframe', { type: type, url: url });
        frame.src = url;
        updateShellHomeSidebarState(btn);

        /* update browser URL bar without navigation */
        if (history.replaceState && WS_ID) {
            history.replaceState(null, '', '/customer/full-view/' + WS_ID
                + '?type=' + encodeURIComponent(type)
                + '&ref='  + encodeURIComponent(ref));
        }
    }

    /* ---- bind sidebar buttons ---- */
    if (sidebar) {
        sidebar.addEventListener('click', function (evt) {
            var btn = evt.target && evt.target.closest ? evt.target.closest('.fv-sidebar-btn') : null;
            if (!btn || !sidebar.contains(btn)) return;
            evt.preventDefault();
            fvLog('log', 'Sidebar click captured', {
                label: tabDisplayName(btn),
                type: btn.dataset.tabType || '',
                rawContent: btn.dataset.content || '{}'
            });
            loadTab(btn);
        });
        fvLog('log', 'Sidebar click delegation bound', { buttonCount: sidebar.querySelectorAll('.fv-sidebar-btn').length });
    }

    if (frame) {
        frame.addEventListener('load', function () {
            fvLog('log', 'Iframe load event', { src: frame.src });
        });
        frame.addEventListener('error', function () {
            fvLog('error', 'Iframe error event', { src: frame.src });
        });
    }

    /* ---- auto-select initial tab based on URL params ---- */
    function autoSelect() {
        if (!sidebar) return;
        var btns = sidebar.querySelectorAll('.fv-sidebar-btn');
        var initTypeNorm = normalizeTabType(INIT_TYPE);
        fvLog('log', 'Auto-select started', {
            initType: INIT_TYPE,
            initTypeNorm: initTypeNorm,
            initRef: INIT_REF,
            totalButtons: btns.length
        });

        function isInternalEmbeddable(btn) {
            var type = normalizeTabType(btn.dataset.tabType || '');
            if (type === '360_pano' || type === 'drone_view') return false;
            var cd = parseContentData(btn);
            if (cd && cd.url && normalizeYouTubeEmbedUrl(cd.url)) return true;
            if (type === 'location' || type === 'brochure' || type === 'custom') return false;
            var ref = btn.dataset.refFloorplan || btn.dataset.refGallery
                    || btn.dataset.refDaynight || btn.dataset.refProjectplan || '';
            return !!embedUrl(type, ref, cd);
        }

        // 1) Try URL-requested target when provided
        if (initTypeNorm) {
            for (var i = 0; i < btns.length; i++) {
                var b = btns[i];
                if (normalizeTabType(b.dataset.tabType) !== initTypeNorm) continue;
                var ref = b.dataset.refFloorplan || b.dataset.refGallery
                        || b.dataset.refDaynight  || b.dataset.refProjectplan || '';
                if (INIT_REF && ref && String(ref) !== String(INIT_REF)) continue;
                fvLog('log', 'Auto-select matched init target', { label: tabDisplayName(b), type: b.dataset.tabType, ref: ref });
                loadTab(b);
                return;
            }
        }

        // 2) Default landing behavior: auto-load the first internal project tab
        for (var j = 0; j < btns.length; j++) {
            if (isInternalEmbeddable(btns[j])) {
                fvLog('log', 'Auto-select chose first internal tab', {
                    label: tabDisplayName(btns[j]),
                    type: btns[j].dataset.tabType
                });
                loadTab(btns[j]);
                return;
            }
        }
        fvLog('warn', 'Auto-select found no embeddable tab');
    }

    autoSelect();
})();
</script>
</body>
</html>
