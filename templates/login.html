<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In – Horizon Estates</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --color-bg: #0a0a0b;
            --color-bg-card: #1a1a1c;
            --color-text: #f5f5f0;
            --color-text-dim: #a0a0a0;
            --color-accent: #c9a962;
            --color-accent-hover: #d4b06e;
            --color-danger: #ef4444;
            --color-success: #22c55e;
            --color-border: rgba(255, 255, 255, 0.08);
            --font-display: 'Instrument Serif', Georgia, serif;
            --font-body: 'Syne', sans-serif;
            --radius: 12px;
            --radius-sm: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100vh;
            font-family: var(--font-body);
            background: var(--color-bg);
            color: var(--color-text);
        }

        body {
            background: radial-gradient(ellipse at 20% 0%, rgba(201, 169, 98, 0.08) 0%, transparent 50%), var(--color-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 2rem 3rem;
        }

        .logo {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-style: italic;
            color: var(--color-text);
            text-decoration: none;
        }

        .logo span {
            color: var(--color-accent);
        }

        .card {
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
        }

        .card h1 {
            font-family: var(--font-display);
            font-size: 1.75rem;
            font-weight: 400;
            margin-bottom: 0.5rem;
        }

        .card .subtitle {
            color: var(--color-text-dim);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--color-text-dim);
            margin-bottom: 0.5rem;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            color: var(--color-text);
            font-family: var(--font-body);
            font-size: 0.95rem;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--color-accent);
        }

        .btn {
            width: 100%;
            padding: 0.85rem 1.5rem;
            border-radius: var(--radius-sm);
            font-family: var(--font-body);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            margin-top: 0.5rem;
            background: var(--color-accent);
            color: var(--color-bg);
        }

        .btn:hover {
            background: var(--color-accent-hover);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .tab {
            padding: 0.5rem 1rem;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--color-text-dim);
            background: transparent;
            border: none;
            font-family: var(--font-body);
        }

        .tab.active {
            color: var(--color-accent);
            font-weight: 600;
        }

        .tab:hover {
            color: var(--color-text);
        }

        .panel {
            display: none;
        }

        .panel.active {
            display: block;
        }

        .msg {
            font-size: 0.85rem;
            margin-top: 0.5rem;
        }

        .msg.error {
            color: var(--color-danger);
        }

        .msg.success {
            color: var(--color-success);
        }

        .loading {
            text-align: center;
            color: var(--color-text-dim);
            padding: 2rem;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>
    <header class="header">
        <a href="/" class="logo">Horizon <span>Estates</span></a>
    </header>

    <div class="card" id="card">
        <div id="loading-msg" class="loading">Loading…</div>
        <div id="auth-ui" class="hidden">
            <h1>Sign in</h1>
            <p class="subtitle" id="subtitle">Use your email and password to access the platform.</p>
            <div class="tabs">
                <button type="button" class="tab active" data-tab="signin">Sign in</button>
                <button type="button" class="tab" data-tab="signup">Sign up</button>
            </div>
            <div id="panel-signin" class="panel active">
                <form id="form-signin">
                    <div class="form-group">
                        <label class="form-label" for="signin-email">Email</label>
                        <input type="email" id="signin-email" class="form-input" required placeholder="you@example.com"
                            autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="signin-password">Password</label>
                        <input type="password" id="signin-password" class="form-input" required placeholder="••••••••"
                            autocomplete="current-password">
                    </div>
                    <div id="signin-error" class="msg error" style="display:none;"></div>
                    <button type="submit" class="btn" id="btn-signin">Sign in</button>
                </form>
            </div>
            <div id="panel-signup" class="panel">
                <form id="form-signup">
                    <div class="form-group">
                        <label class="form-label" for="signup-name">Username / Name</label>
                        <input type="text" id="signup-name" class="form-input" required placeholder="Your name"
                            autocomplete="name">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="signup-email">Email</label>
                        <input type="email" id="signup-email" class="form-input" required placeholder="you@example.com"
                            autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="signup-password">Password</label>
                        <input type="password" id="signup-password" class="form-input" required minlength="6"
                            placeholder="At least 6 characters" autocomplete="new-password">
                    </div>
                    <div id="signup-error" class="msg error" style="display:none;"></div>
                    <button type="submit" class="btn" id="btn-signup">Create account</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Self-hosted Supabase (same origin = no tracking prevention block) -->
    <script src="/static/js/supabase.min.js"></script>
    <script>
        (function () {
            var supabaseUrl = {{ (supabase_url or '')| tojson
        }};
        var supabaseAnonKey = {{ (supabase_anon_key or '')| tojson }};
        var loadingEl = document.getElementById('loading-msg');
        var authUi = document.getElementById('auth-ui');
        var subtitleEl = document.getElementById('subtitle');

        function showAuthUI() {
            loadingEl.classList.add('hidden');
            authUi.classList.remove('hidden');
        }

        function showError(msg) {
            loadingEl.textContent = msg;
            loadingEl.classList.remove('hidden');
            authUi.classList.add('hidden');
        }

        // 1) Check config
        if (!supabaseUrl || !supabaseAnonKey) {
            showError('Supabase is not configured. Set SUPABASE_URL and SUPABASE_ANON_KEY in .env');
            return;
        }

        // 2) Check Supabase library loaded (same-origin script avoids tracking prevention)
        if (typeof window.supabase === 'undefined') {
            showError('Auth library could not load. Refresh the page or check your connection.');
            return;
        }

        var supabase = window.supabase.createClient(supabaseUrl, supabaseAnonKey);

        // 3) Check existing session → redirect to dashboard
        supabase.auth.getSession().then(function (r) {
            var session = r.data.session;
            if (session && session.user && session.user.id) {
                window.location.replace('/dashboard/' + encodeURIComponent(session.user.id));
                return;
            }
            if (session) {
                window.location.replace('/dashboard');
                return;
            }
            showAuthUI();
        }).catch(function () {
            showAuthUI();
        });

        // Tabs
        document.querySelectorAll('.tab').forEach(function (t) {
            t.addEventListener('click', function () {
                var tab = this.getAttribute('data-tab');
                document.querySelectorAll('.tab').forEach(function (x) { x.classList.remove('active'); });
                document.querySelectorAll('.panel').forEach(function (x) { x.classList.remove('active'); });
                this.classList.add('active');
                var panel = document.getElementById('panel-' + tab);
                if (panel) panel.classList.add('active');
            });
        });

        function setError(el, msg) {
            el.textContent = msg || '';
            el.style.display = msg ? 'block' : 'none';
        }

        document.getElementById('form-signin').addEventListener('submit', function (e) {
            e.preventDefault();
            var btn = document.getElementById('btn-signin');
            var errEl = document.getElementById('signin-error');
            setError(errEl, '');
            btn.disabled = true;
            var email = document.getElementById('signin-email').value.trim();
            var password = document.getElementById('signin-password').value;
            supabase.auth.signInWithPassword({ email: email, password: password })
                .then(function (res) {
                    var data = res.data, error = res.error;
                    if (error) throw error;
                    var uid = data.user && data.user.id ? data.user.id : '';
                    window.location.href = uid ? '/dashboard/' + encodeURIComponent(uid) : '/dashboard';
                })
                .catch(function (err) {
                    setError(errEl, err.message || 'Sign in failed');
                })
                .finally(function () {
                    btn.disabled = false;
                });
        });

        document.getElementById('form-signup').addEventListener('submit', function (e) {
            e.preventDefault();
            var btn = document.getElementById('btn-signup');
            var errEl = document.getElementById('signup-error');
            setError(errEl, '');
            btn.disabled = true;
            var name = document.getElementById('signup-name').value.trim();
            var email = document.getElementById('signup-email').value.trim();
            var password = document.getElementById('signup-password').value;
            supabase.auth.signUp({ email: email, password: password })
                .then(function (res) {
                    var data = res.data, error = res.error;
                    if (error) throw error;
                    if (data.user && !data.session) {
                        setError(errEl, 'Check your email to confirm your account.');
                        return;
                    }
                    var session = data.session;
                    var token = session ? session.access_token : null;
                    if (token && name) {
                        return fetch('/api/profile/me', {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                            body: JSON.stringify({ display_name: name, email: email })
                        }).then(function (r) {
                            if (!r.ok) return Promise.reject(new Error('Could not save profile'));
                            var uid = data.user && data.user.id ? data.user.id : '';
                            window.location.href = uid ? '/dashboard/' + encodeURIComponent(uid) : '/dashboard';
                        });
                    }
                    var uid = data.user && data.user.id ? data.user.id : '';
                    window.location.href = uid ? '/dashboard/' + encodeURIComponent(uid) : '/dashboard';
                })
                .catch(function (err) {
                    setError(errEl, err.message || 'Sign up failed');
                })
                .finally(function () {
                    btn.disabled = false;
                });
        });
        }) ();
    </script>
</body>

</html>
