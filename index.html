<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Property Panorama - Plot Marker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg: #0a0a0b;
            --color-text: #f5f5f0;
            --color-accent: #c9a962;
            --color-accent-dim: rgba(201, 169, 98, 0.3);
            --color-muted: #6b6b6b;
            --color-success: #4ade80;
            --color-danger: #ef4444;
            --font-display: 'Instrument Serif', Georgia, serif;
            --font-body: 'Syne', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: var(--font-body);
            background: var(--color-bg);
            color: var(--color-text);
            touch-action: none;
        }

        /* Image container */
        .image-container {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            cursor: grab;
            background: var(--color-bg);
        }

        .image-container.dragging {
            cursor: grabbing;
        }

        .image-container.edit-mode {
            cursor: crosshair;
        }

        .image-container.edit-mode.dragging {
            cursor: crosshair;
        }

        /* Image wrapper */
        .image-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: center center;
            transition: transform 0.1s ease-out;
            will-change: transform;
        }

        .image-wrapper.no-transition {
            transition: none;
        }

        .panorama-image {
            display: block;
            max-width: none;
            user-select: none;
            -webkit-user-drag: none;
            pointer-events: none;
        }

        /* Canvas overlay for drawing */
        .drawing-canvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .image-container.edit-mode .drawing-canvas {
            pointer-events: auto;
        }

        /* Plots overlay */
        .plots-overlay {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .image-container:not(.edit-mode) .plots-overlay {
            pointer-events: auto;
        }

        .plot-area {
            position: absolute;
            cursor: pointer;
            pointer-events: auto;
            transition: filter 0.2s ease;
        }

        .plot-area:hover {
            filter: brightness(1.2);
        }

        .image-container.edit-mode .plots-overlay {
            pointer-events: none;
        }

        /* Gradient overlays */
        .overlay-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            background: 
                linear-gradient(to bottom, rgba(10, 10, 11, 0.3) 0%, transparent 10%, transparent 90%, rgba(10, 10, 11, 0.4) 100%),
                linear-gradient(to right, rgba(10, 10, 11, 0.2) 0%, transparent 5%, transparent 95%, rgba(10, 10, 11, 0.2) 100%);
        }

        /* UI Overlay */
        .ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem 2.5rem;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .logo {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-style: italic;
            letter-spacing: 0.02em;
            color: var(--color-text);
        }

        .header-controls {
            display: flex;
            gap: 0.75rem;
            pointer-events: auto;
        }

        /* Edit Mode Toggle */
        .edit-toggle {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(10, 10, 11, 0.8);
            border: 1px solid var(--color-accent-dim);
            color: var(--color-text);
            padding: 0.6rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-family: var(--font-body);
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
        }

        .edit-toggle:hover {
            border-color: var(--color-accent);
            background: rgba(201, 169, 98, 0.1);
        }

        .edit-toggle.active {
            background: rgba(201, 169, 98, 0.2);
            border-color: var(--color-accent);
            color: var(--color-accent);
        }

        .edit-toggle-icon {
            font-size: 1rem;
        }

        /* Footer */
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        /* Zoom Controls */
        .zoom-controls {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            pointer-events: auto;
            background: rgba(10, 10, 11, 0.8);
            padding: 0.75rem;
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }

        .zoom-btn {
            width: 40px;
            height: 40px;
            background: rgba(201, 169, 98, 0.2);
            border: 1px solid var(--color-accent-dim);
            color: var(--color-accent);
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            border-radius: 4px;
        }

        .zoom-btn:hover {
            background: rgba(201, 169, 98, 0.3);
            border-color: var(--color-accent);
        }

        .zoom-info {
            text-align: center;
            font-size: 0.7rem;
            color: var(--color-muted);
            margin-top: 0.5rem;
        }

        /* Edit Instructions Panel */
        .edit-panel {
            display: none;
            flex-direction: column;
            gap: 0.75rem;
            pointer-events: auto;
            background: rgba(10, 10, 11, 0.9);
            padding: 1.25rem;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            border: 1px solid var(--color-accent-dim);
            max-width: 280px;
        }

        .edit-panel.visible {
            display: flex;
        }

        .edit-panel-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--color-accent);
            margin-bottom: 0.25rem;
        }

        .edit-instruction {
            font-size: 0.75rem;
            color: var(--color-muted);
            line-height: 1.5;
        }

        .edit-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .edit-btn {
            flex: 1;
            padding: 0.5rem 0.75rem;
            border-radius: 4px;
            font-size: 0.7rem;
            font-family: var(--font-body);
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .edit-btn.primary {
            background: var(--color-accent);
            border: 1px solid var(--color-accent);
            color: var(--color-bg);
        }

        .edit-btn.primary:hover:not(:disabled) {
            background: #d4b06e;
        }

        .edit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed !important;
            pointer-events: none;
        }

        .edit-btn.secondary {
            background: transparent;
            border: 1px solid var(--color-muted);
            color: var(--color-muted);
        }

        .edit-btn.secondary:hover {
            border-color: var(--color-text);
            color: var(--color-text);
        }

        .edit-btn.danger {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid var(--color-danger);
            color: var(--color-danger);
        }

        .edit-btn.danger:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        /* Plots List */
        .plots-list {
            max-height: 150px;
            overflow-y: auto;
            margin-top: 0.5rem;
        }

        .plot-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            margin-bottom: 0.5rem;
            font-size: 0.75rem;
        }

        .plot-item-name {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .plot-item-color {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }

        .plot-item-delete {
            background: none;
            border: none;
            color: var(--color-danger);
            cursor: pointer;
            font-size: 0.9rem;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .plot-item-delete:hover {
            opacity: 1;
        }

        /* Plot Form Modal */
        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        .modal-backdrop.visible {
            display: flex;
        }

        .modal {
            background: #1a1a1b;
            border-radius: 12px;
            padding: 2rem;
            max-width: 400px;
            width: 90%;
            border: 1px solid var(--color-accent-dim);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .modal-title {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-style: italic;
            margin-bottom: 1.5rem;
            color: var(--color-accent);
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--color-muted);
            margin-bottom: 0.5rem;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: var(--color-text);
            font-family: var(--font-body);
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--color-accent);
        }

        .form-input::placeholder {
            color: var(--color-muted);
        }

        textarea.form-input {
            resize: vertical;
            min-height: 80px;
        }

        /* Color Picker */
        .color-options {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .color-option {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s ease;
        }

        .color-option:hover {
            transform: scale(1.1);
        }

        .color-option.selected {
            border-color: var(--color-text);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .modal-actions {
            display: flex;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }

        .modal-btn {
            flex: 1;
            padding: 0.75rem 1rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-family: var(--font-body);
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .modal-btn.primary {
            background: var(--color-accent);
            border: 1px solid var(--color-accent);
            color: var(--color-bg);
        }

        .modal-btn.primary:hover {
            background: #d4b06e;
        }

        .modal-btn.secondary {
            background: transparent;
            border: 1px solid var(--color-muted);
            color: var(--color-muted);
        }

        .modal-btn.secondary:hover {
            border-color: var(--color-text);
            color: var(--color-text);
        }

        /* Plot Details Modal */
        .details-modal .modal {
            max-width: 500px;
        }

        .details-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .details-color {
            width: 50px;
            height: 50px;
            border-radius: 8px;
        }

        .details-title {
            font-family: var(--font-display);
            font-size: 1.75rem;
            font-style: italic;
            color: var(--color-text);
        }

        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .detail-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 1rem;
            border-radius: 8px;
        }

        .detail-item.full-width {
            grid-column: 1 / -1;
        }

        .detail-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--color-muted);
            margin-bottom: 0.35rem;
        }

        .detail-value {
            font-size: 1.1rem;
            color: var(--color-text);
        }

        .detail-value.price {
            color: var(--color-accent);
            font-family: var(--font-display);
            font-size: 1.4rem;
        }

        .detail-value.description {
            font-size: 0.9rem;
            line-height: 1.5;
            color: var(--color-muted);
        }

        /* Loading overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--color-bg);
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loading-text {
            font-family: var(--font-display);
            font-size: 1.2rem;
            font-style: italic;
            color: var(--color-accent);
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 2px solid var(--color-accent-dim);
            border-top-color: var(--color-accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .ui-overlay {
                padding: 1.5rem;
            }

            .modal {
                padding: 1.5rem;
            }

            .details-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading panorama...</div>
    </div>

    <!-- Image Container -->
    <div class="image-container" id="image-container">
        <div class="image-wrapper" id="image-wrapper">
            <img src="pexels-eslames1-32542478.jpg" alt="Property Panorama" class="panorama-image" id="panorama-image">
            <canvas class="drawing-canvas" id="drawing-canvas"></canvas>
            <svg class="plots-overlay" id="plots-overlay"></svg>
        </div>
    </div>

    <!-- Gradient Overlay -->
    <div class="overlay-gradient"></div>

    <!-- UI Overlay -->
    <div class="ui-overlay">
        <header class="header">
            <div class="logo">Horizon Estates</div>
            <div class="header-controls">
                <button class="edit-toggle" id="edit-toggle">
                    <span class="edit-toggle-icon">✏️</span>
                    <span id="edit-toggle-text">Edit Mode</span>
                </button>
            </div>
        </header>

        <footer class="footer">
            <div class="zoom-controls">
                <button class="zoom-btn" id="zoom-in">+</button>
                <button class="zoom-btn" id="zoom-out">−</button>
                <button class="zoom-btn" id="zoom-reset" style="font-size: 0.9rem;">⌂</button>
                <div class="zoom-info" id="zoom-level">100%</div>
            </div>

            <div class="edit-panel" id="edit-panel">
                <div class="edit-panel-title">Plot Drawing</div>
                <div class="edit-instruction" id="edit-instruction">
                    Click on the image to start drawing a plot boundary. Click points to create the shape, then click the first point or press Enter to complete.
                </div>
                <div class="edit-actions" id="edit-actions">
                    <button class="edit-btn secondary" id="cancel-drawing">Cancel</button>
                    <button class="edit-btn primary" id="complete-drawing" disabled>Complete</button>
                </div>
                
                <div class="edit-panel-title" style="margin-top: 1rem;">Saved Plots</div>
                <div class="plots-list" id="plots-list">
                    <div class="edit-instruction" style="font-style: italic;">No plots created yet</div>
                </div>
            </div>

            <div style="width: 200px;"></div>
        </footer>
    </div>

    <!-- Plot Form Modal -->
    <div class="modal-backdrop" id="plot-form-modal">
        <div class="modal">
            <div class="modal-title">Define Plot</div>
            
            <div class="form-group">
                <label class="form-label">Plot Name *</label>
                <input type="text" class="form-input" id="plot-name" placeholder="e.g., Plot A-12">
            </div>

            <div class="form-group">
                <label class="form-label">Area (sq ft)</label>
                <input type="text" class="form-input" id="plot-area" placeholder="e.g., 2,400">
            </div>

            <div class="form-group">
                <label class="form-label">Price</label>
                <input type="text" class="form-input" id="plot-price" placeholder="e.g., $125,000">
            </div>

            <div class="form-group">
                <label class="form-label">Status</label>
                <select class="form-input" id="plot-status">
                    <option value="available">Available</option>
                    <option value="reserved">Reserved</option>
                    <option value="sold">Sold</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Description</label>
                <textarea class="form-input" id="plot-description" placeholder="Add any additional details..."></textarea>
            </div>

            <div class="form-group">
                <label class="form-label">Color Theme</label>
                <div class="color-options" id="color-options">
                    <div class="color-option selected" data-color="emerald" style="background: linear-gradient(135deg, #10b981, #059669);"></div>
                    <div class="color-option" data-color="blue" style="background: linear-gradient(135deg, #3b82f6, #1d4ed8);"></div>
                    <div class="color-option" data-color="purple" style="background: linear-gradient(135deg, #8b5cf6, #6d28d9);"></div>
                    <div class="color-option" data-color="amber" style="background: linear-gradient(135deg, #f59e0b, #d97706);"></div>
                    <div class="color-option" data-color="rose" style="background: linear-gradient(135deg, #f43f5e, #be123c);"></div>
                    <div class="color-option" data-color="cyan" style="background: linear-gradient(135deg, #06b6d4, #0891b2);"></div>
                    <div class="color-option" data-color="lime" style="background: linear-gradient(135deg, #84cc16, #65a30d);"></div>
                    <div class="color-option" data-color="orange" style="background: linear-gradient(135deg, #f97316, #ea580c);"></div>
                </div>
            </div>

            <div class="modal-actions">
                <button class="modal-btn secondary" id="cancel-plot">Cancel</button>
                <button class="modal-btn primary" id="save-plot">Save Plot</button>
            </div>
        </div>
    </div>

    <!-- Plot Details Modal -->
    <div class="modal-backdrop details-modal" id="plot-details-modal">
        <div class="modal">
            <div class="details-header">
                <div class="details-color" id="details-color"></div>
                <div class="details-title" id="details-title">Plot Name</div>
            </div>
            
            <div class="details-grid">
                <div class="detail-item">
                    <div class="detail-label">Area</div>
                    <div class="detail-value" id="details-area">—</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Status</div>
                    <div class="detail-value" id="details-status">—</div>
                </div>
                <div class="detail-item full-width">
                    <div class="detail-label">Price</div>
                    <div class="detail-value price" id="details-price">—</div>
                </div>
                <div class="detail-item full-width" id="details-description-container">
                    <div class="detail-label">Description</div>
                    <div class="detail-value description" id="details-description">—</div>
                </div>
            </div>

            <div class="modal-actions">
                <button class="modal-btn secondary" id="close-details">Close</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Elements
            const imageContainer = document.getElementById('image-container');
            const imageWrapper = document.getElementById('image-wrapper');
            const panoramaImage = document.getElementById('panorama-image');
            const drawingCanvas = document.getElementById('drawing-canvas');
            const plotsOverlay = document.getElementById('plots-overlay');
            const loading = document.getElementById('loading');
            const editToggle = document.getElementById('edit-toggle');
            const editToggleText = document.getElementById('edit-toggle-text');
            const editPanel = document.getElementById('edit-panel');
            const editInstruction = document.getElementById('edit-instruction');
            const cancelDrawingBtn = document.getElementById('cancel-drawing');
            const completeDrawingBtn = document.getElementById('complete-drawing');
            const plotsList = document.getElementById('plots-list');
            const plotFormModal = document.getElementById('plot-form-modal');
            const plotDetailsModal = document.getElementById('plot-details-modal');
            const zoomInBtn = document.getElementById('zoom-in');
            const zoomOutBtn = document.getElementById('zoom-out');
            const zoomResetBtn = document.getElementById('zoom-reset');
            const zoomLevel = document.getElementById('zoom-level');

            // Canvas context
            const ctx = drawingCanvas.getContext('2d');

            // State
            let scale = 2.0;
            let translateX = 0;
            let translateY = 0;
            let isDragging = false;
            let dragStartX = 0;
            let dragStartY = 0;
            let dragStartTranslateX = 0;
            let dragStartTranslateY = 0;
            let imageWidth = 0;
            let imageHeight = 0;
            let containerWidth = 0;
            let containerHeight = 0;
            let minScale = 0.5;
            let maxScale = 5.0;

            // Edit mode state
            let isEditMode = false;
            let isDrawing = false;
            let currentPoints = [];
            let plots = [];
            let selectedColor = 'emerald';

            // Color gradients
            const colorGradients = {
                emerald: { start: '#10b981', end: '#059669', fill: 'rgba(16, 185, 129, 0.35)' },
                blue: { start: '#3b82f6', end: '#1d4ed8', fill: 'rgba(59, 130, 246, 0.35)' },
                purple: { start: '#8b5cf6', end: '#6d28d9', fill: 'rgba(139, 92, 246, 0.35)' },
                amber: { start: '#f59e0b', end: '#d97706', fill: 'rgba(245, 158, 11, 0.35)' },
                rose: { start: '#f43f5e', end: '#be123c', fill: 'rgba(244, 63, 94, 0.35)' },
                cyan: { start: '#06b6d4', end: '#0891b2', fill: 'rgba(6, 182, 212, 0.35)' },
                lime: { start: '#84cc16', end: '#65a30d', fill: 'rgba(132, 204, 22, 0.35)' },
                orange: { start: '#f97316', end: '#ea580c', fill: 'rgba(249, 115, 22, 0.35)' }
            };

            // Initialize
            panoramaImage.onload = () => {
                imageWidth = panoramaImage.naturalWidth;
                imageHeight = panoramaImage.naturalHeight;
                containerWidth = imageContainer.clientWidth;
                containerHeight = imageContainer.clientHeight;

                panoramaImage.style.width = `${imageWidth}px`;
                panoramaImage.style.height = `${imageHeight}px`;

                // Set canvas size
                drawingCanvas.width = imageWidth;
                drawingCanvas.height = imageHeight;
                drawingCanvas.style.width = `${imageWidth}px`;
                drawingCanvas.style.height = `${imageHeight}px`;

                // Set SVG size
                plotsOverlay.setAttribute('width', imageWidth);
                plotsOverlay.setAttribute('height', imageHeight);
                plotsOverlay.style.width = `${imageWidth}px`;
                plotsOverlay.style.height = `${imageHeight}px`;

                updateTransform();
                loadPlots();
                loading.classList.add('hidden');
            };

            // Transform functions
            function updateTransform(noTransition = false) {
                if (noTransition) {
                    imageWrapper.classList.add('no-transition');
                } else {
                    imageWrapper.classList.remove('no-transition');
                }

                const scaledWidth = imageWidth * scale;
                const scaledHeight = imageHeight * scale;
                const maxTranslateX = Math.max(0, (scaledWidth - containerWidth) / 2);
                const maxTranslateY = Math.max(0, (scaledHeight - containerHeight) / 2);

                translateX = Math.max(-maxTranslateX, Math.min(maxTranslateX, translateX));
                translateY = Math.max(-maxTranslateY, Math.min(maxTranslateY, translateY));

                imageWrapper.style.transform = `translate(-50%, -50%) translate(${translateX}px, ${translateY}px) scale(${scale})`;
                zoomLevel.textContent = `${Math.round(scale * 100)}%`;
            }

            // Zoom functions
            function zoomIn() { scale = Math.min(maxScale, scale * 1.2); updateTransform(); }
            function zoomOut() { scale = Math.max(minScale, scale / 1.2); updateTransform(); }
            function resetZoom() { scale = 2.0; translateX = 0; translateY = 0; updateTransform(); }

            zoomInBtn.addEventListener('click', zoomIn);
            zoomOutBtn.addEventListener('click', zoomOut);
            zoomResetBtn.addEventListener('click', resetZoom);

            // Mouse wheel zoom
            imageContainer.addEventListener('wheel', (e) => {
                if (isDrawing) return;
                e.preventDefault();
                const delta = e.deltaY > 0 ? -0.1 : 0.1;
                scale = Math.max(minScale, Math.min(maxScale, scale + delta));
                updateTransform();
            }, { passive: false });

            // Pan functionality (when not in edit mode or not drawing)
            imageContainer.addEventListener('mousedown', (e) => {
                if (isEditMode) return;
                if (e.button !== 0) return;
                isDragging = true;
                imageContainer.classList.add('dragging');
                dragStartX = e.clientX;
                dragStartY = e.clientY;
                dragStartTranslateX = translateX;
                dragStartTranslateY = translateY;
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                translateX = dragStartTranslateX + (e.clientX - dragStartX);
                translateY = dragStartTranslateY + (e.clientY - dragStartY);
                updateTransform(true);
            });

            document.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    imageContainer.classList.remove('dragging');
                    updateTransform();
                }
            });

            // Edit mode toggle
            editToggle.addEventListener('click', () => {
                isEditMode = !isEditMode;
                imageContainer.classList.toggle('edit-mode', isEditMode);
                editToggle.classList.toggle('active', isEditMode);
                editPanel.classList.toggle('visible', isEditMode);
                editToggleText.textContent = isEditMode ? 'Exit Edit' : 'Edit Mode';

                if (!isEditMode) {
                    cancelDrawing();
                }
            });

            // Get image coordinates from mouse event
            function getImageCoords(e) {
                const rect = drawingCanvas.getBoundingClientRect();
                // Canvas is already transformed with the wrapper, so we need to account for that
                // The canvas rect already includes the transform, so we just need to scale
                const x = ((e.clientX - rect.left) / rect.width) * imageWidth;
                const y = ((e.clientY - rect.top) / rect.height) * imageHeight;
                return { x, y };
            }

            // Drawing on canvas
            drawingCanvas.addEventListener('click', (e) => {
                if (!isEditMode) return;
                e.stopPropagation();
                e.preventDefault();

                const coords = getImageCoords(e);
                console.log('Canvas clicked at:', coords, 'Current points:', currentPoints.length);
                
                // Check if clicking near first point to close polygon
                if (currentPoints.length >= 3) {
                    const firstPoint = currentPoints[0];
                    const distance = Math.hypot(coords.x - firstPoint.x, coords.y - firstPoint.y);
                    const threshold = 20; // pixels
                    if (distance < threshold) {
                        console.log('Closing polygon by clicking first point');
                        completeDrawing();
                        return;
                    }
                }

                currentPoints.push(coords);
                isDrawing = true;
                const canComplete = currentPoints.length >= 3;
                completeDrawingBtn.disabled = !canComplete;
                if (canComplete) {
                    completeDrawingBtn.style.opacity = '1';
                    completeDrawingBtn.style.cursor = 'pointer';
                }
                
                drawCurrentPolygon();
                updateEditInstruction();
            });

            drawingCanvas.addEventListener('mousemove', (e) => {
                if (!isEditMode || currentPoints.length === 0) return;
                drawCurrentPolygon(getImageCoords(e));
            });

            function drawCurrentPolygon(mousePos = null) {
                ctx.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);

                if (currentPoints.length === 0) return;

                // Draw filled polygon
                ctx.beginPath();
                ctx.moveTo(currentPoints[0].x, currentPoints[0].y);
                for (let i = 1; i < currentPoints.length; i++) {
                    ctx.lineTo(currentPoints[i].x, currentPoints[i].y);
                }
                if (mousePos) {
                    ctx.lineTo(mousePos.x, mousePos.y);
                }
                ctx.closePath();

                ctx.fillStyle = 'rgba(201, 169, 98, 0.3)';
                ctx.fill();
                ctx.strokeStyle = '#c9a962';
                ctx.lineWidth = 3;
                ctx.stroke();

                // Draw points
                currentPoints.forEach((point, index) => {
                    ctx.beginPath();
                    ctx.arc(point.x, point.y, 8, 0, Math.PI * 2);
                    ctx.fillStyle = index === 0 ? '#4ade80' : '#c9a962';
                    ctx.fill();
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                });
            }

            function updateEditInstruction() {
                if (currentPoints.length === 0) {
                    editInstruction.textContent = 'Click on the image to start drawing a plot boundary.';
                } else if (currentPoints.length < 3) {
                    editInstruction.textContent = `${currentPoints.length} point(s) added. Add at least ${3 - currentPoints.length} more to complete.`;
                } else {
                    editInstruction.textContent = `${currentPoints.length} points. Click the green starting point or press Complete to finish.`;
                }
            }

            function cancelDrawing() {
                currentPoints = [];
                isDrawing = false;
                completeDrawingBtn.disabled = true;
                completeDrawingBtn.style.opacity = '0.5';
                completeDrawingBtn.style.cursor = 'not-allowed';
                ctx.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);
                updateEditInstruction();
            }

            function completeDrawing() {
                if (currentPoints.length < 3) {
                    console.log('Need at least 3 points to complete');
                    return;
                }
                
                // Show form modal
                plotFormModal.classList.add('visible');
                setTimeout(() => {
                    document.getElementById('plot-name').focus();
                }, 100);
            }

            cancelDrawingBtn.addEventListener('click', cancelDrawing);
            completeDrawingBtn.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                completeDrawing();
            });

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && isDrawing && currentPoints.length >= 3) {
                    completeDrawing();
                } else if (e.key === 'Escape') {
                    if (plotFormModal.classList.contains('visible')) {
                        closePlotForm();
                    } else if (plotDetailsModal.classList.contains('visible')) {
                        plotDetailsModal.classList.remove('visible');
                    } else if (isDrawing) {
                        cancelDrawing();
                    } else if (isEditMode) {
                        editToggle.click();
                    }
                }
            });

            // Color selection
            document.querySelectorAll('.color-option').forEach(option => {
                option.addEventListener('click', () => {
                    document.querySelectorAll('.color-option').forEach(o => o.classList.remove('selected'));
                    option.classList.add('selected');
                    selectedColor = option.dataset.color;
                });
            });

            // Plot form
            function closePlotForm() {
                plotFormModal.classList.remove('visible');
                document.getElementById('plot-name').value = '';
                document.getElementById('plot-area').value = '';
                document.getElementById('plot-price').value = '';
                document.getElementById('plot-status').value = 'available';
                document.getElementById('plot-description').value = '';
                cancelDrawing();
            }

            document.getElementById('cancel-plot').addEventListener('click', closePlotForm);

            document.getElementById('save-plot').addEventListener('click', () => {
                const name = document.getElementById('plot-name').value.trim();
                if (!name) {
                    document.getElementById('plot-name').focus();
                    return;
                }

                const plot = {
                    id: Date.now(),
                    name: name,
                    area: document.getElementById('plot-area').value.trim(),
                    price: document.getElementById('plot-price').value.trim(),
                    status: document.getElementById('plot-status').value,
                    description: document.getElementById('plot-description').value.trim(),
                    color: selectedColor,
                    points: [...currentPoints]
                };

                plots.push(plot);
                savePlots();
                renderPlots();
                updatePlotsList();
                closePlotForm();
            });

            // Render plots as SVG polygons
            function renderPlots() {
                plotsOverlay.innerHTML = '';

                // Add gradient definitions
                const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
                
                Object.entries(colorGradients).forEach(([name, colors]) => {
                    const gradient = document.createElementNS('http://www.w3.org/2000/svg', 'linearGradient');
                    gradient.setAttribute('id', `gradient-${name}`);
                    gradient.setAttribute('x1', '0%');
                    gradient.setAttribute('y1', '0%');
                    gradient.setAttribute('x2', '100%');
                    gradient.setAttribute('y2', '100%');

                    const stop1 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
                    stop1.setAttribute('offset', '0%');
                    stop1.setAttribute('stop-color', colors.start);

                    const stop2 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
                    stop2.setAttribute('offset', '100%');
                    stop2.setAttribute('stop-color', colors.end);

                    gradient.appendChild(stop1);
                    gradient.appendChild(stop2);
                    defs.appendChild(gradient);
                });

                plotsOverlay.appendChild(defs);

                plots.forEach(plot => {
                    const colors = colorGradients[plot.color];
                    const pointsStr = plot.points.map(p => `${p.x},${p.y}`).join(' ');

                    const polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                    polygon.setAttribute('points', pointsStr);
                    polygon.setAttribute('fill', colors.fill);
                    polygon.setAttribute('stroke', `url(#gradient-${plot.color})`);
                    polygon.setAttribute('stroke-width', '3');
                    polygon.setAttribute('data-plot-id', plot.id);
                    polygon.style.cursor = 'pointer';
                    polygon.style.transition = 'fill 0.2s ease';

                    polygon.addEventListener('mouseenter', () => {
                        polygon.setAttribute('fill', colors.fill.replace('0.35', '0.5'));
                    });

                    polygon.addEventListener('mouseleave', () => {
                        polygon.setAttribute('fill', colors.fill);
                    });

                    polygon.addEventListener('click', (e) => {
                        if (isEditMode) {
                            e.stopPropagation();
                            return;
                        }
                        e.stopPropagation();
                        e.preventDefault();
                        console.log('Plot clicked:', plot.name);
                        showPlotDetails(plot);
                    });
                    
                    // Also add pointer-events style to ensure clicks work
                    polygon.style.pointerEvents = 'auto';

                    plotsOverlay.appendChild(polygon);

                    // Add label
                    const centroid = getCentroid(plot.points);
                    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    text.setAttribute('x', centroid.x);
                    text.setAttribute('y', centroid.y);
                    text.setAttribute('text-anchor', 'middle');
                    text.setAttribute('dominant-baseline', 'middle');
                    text.setAttribute('fill', '#fff');
                    text.setAttribute('font-size', '24');
                    text.setAttribute('font-family', 'Syne, sans-serif');
                    text.setAttribute('font-weight', '600');
                    text.setAttribute('pointer-events', 'none');
                    text.textContent = plot.name;

                    plotsOverlay.appendChild(text);
                });
            }

            function getCentroid(points) {
                let x = 0, y = 0;
                points.forEach(p => { x += p.x; y += p.y; });
                return { x: x / points.length, y: y / points.length };
            }

            // Update plots list in sidebar
            function updatePlotsList() {
                if (plots.length === 0) {
                    plotsList.innerHTML = '<div class="edit-instruction" style="font-style: italic;">No plots created yet</div>';
                    return;
                }

                plotsList.innerHTML = plots.map(plot => `
                    <div class="plot-item">
                        <div class="plot-item-name">
                            <div class="plot-item-color" style="background: linear-gradient(135deg, ${colorGradients[plot.color].start}, ${colorGradients[plot.color].end});"></div>
                            <span>${plot.name}</span>
                        </div>
                        <button class="plot-item-delete" data-id="${plot.id}" title="Delete plot">×</button>
                    </div>
                `).join('');

                plotsList.querySelectorAll('.plot-item-delete').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const id = parseInt(btn.dataset.id);
                        plots = plots.filter(p => p.id !== id);
                        savePlots();
                        renderPlots();
                        updatePlotsList();
                    });
                });
            }

            // Show plot details modal
            function showPlotDetails(plot) {
                const colors = colorGradients[plot.color];
                document.getElementById('details-color').style.background = `linear-gradient(135deg, ${colors.start}, ${colors.end})`;
                document.getElementById('details-title').textContent = plot.name;
                document.getElementById('details-area').textContent = plot.area || '—';
                document.getElementById('details-price').textContent = plot.price || '—';
                
                const statusLabels = { available: 'Available', reserved: 'Reserved', sold: 'Sold' };
                document.getElementById('details-status').textContent = statusLabels[plot.status] || '—';

                const descContainer = document.getElementById('details-description-container');
                if (plot.description) {
                    descContainer.style.display = 'block';
                    document.getElementById('details-description').textContent = plot.description;
                } else {
                    descContainer.style.display = 'none';
                }

                plotDetailsModal.classList.add('visible');
            }

            document.getElementById('close-details').addEventListener('click', () => {
                plotDetailsModal.classList.remove('visible');
            });

            plotDetailsModal.addEventListener('click', (e) => {
                if (e.target === plotDetailsModal) {
                    plotDetailsModal.classList.remove('visible');
                }
            });

            // LocalStorage persistence
            function savePlots() {
                localStorage.setItem('panorama-plots', JSON.stringify(plots));
            }

            function loadPlots() {
                const saved = localStorage.getItem('panorama-plots');
                if (saved) {
                    try {
                        plots = JSON.parse(saved);
                        renderPlots();
                        updatePlotsList();
                    } catch (e) {
                        console.error('Failed to load plots:', e);
                    }
                }
            }
        });
    </script>
</body>
</html>
